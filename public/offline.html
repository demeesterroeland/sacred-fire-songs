<!doctype html>
<!--
  Offline fallback page (issue #353). public/sw.js stores this file on install
  and serves it for page navigations while the browser is offline.
  Self-contained on purpose: no app scripts, styles or fonts are reachable offline.
  Texts come from the offline.* keys in messages/*.ts; testing/unit/tests/offlineFallback.test.ts
  fails when they drift. Bump OFFLINE_CACHE in public/sw.js when you change this file.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff4400">
  <title>Sacred Fire Songs</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fafaf9;
      color: #1f2937;
      text-align: center;
    }
    main { max-width: 26rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .icon { font-size: 1.875rem; margin: 0; }
    h1 { font-size: 1.125rem; font-weight: 700; margin: 0; }
    p { font-size: 0.875rem; line-height: 1.5; color: #6b7280; margin: 0; }
    button {
      margin-top: 0.5rem;
      padding: 0.5rem 1.25rem;
      border: 0;
      border-radius: 0.5rem;
      background: #ff4400;
      color: #fff;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #e03c00; }
    @media (prefers-color-scheme: dark) {
      body { background: #0c0a09; color: #f3f4f6; }
      p { color: #9ca3af; }
    }
  </style>
</head>
<body>
  <main>
    <p class="icon" aria-hidden="true">🔥</p>
    <h1 id="offline-title">You're offline</h1>
    <p id="offline-description">This page needs an internet connection. It reloads by itself as soon as you're back online.</p>
    <button type="button" id="offline-retry">Try again</button>
  </main>
  <script type="application/json" id="offline-messages">
    {
      "en": {
        "offline.title": "You're offline",
        "offline.description": "This page needs an internet connection. It reloads by itself as soon as you're back online.",
        "offline.retry": "Try again"
      },
      "nl": {
        "offline.title": "Je bent offline",
        "offline.description": "Deze pagina heeft een internetverbinding nodig. Ze laadt vanzelf opnieuw zodra je weer online bent.",
        "offline.retry": "Opnieuw proberen"
      },
      "es": {
        "offline.title": "Estás sin conexión",
        "offline.description": "Esta página necesita conexión a internet. Se volverá a cargar sola en cuanto vuelvas a estar en línea.",
        "offline.retry": "Reintentar"
      },
      "it": {
        "offline.title": "Sei offline",
        "offline.description": "Questa pagina ha bisogno di una connessione a internet. Si ricaricherà da sola appena sarai di nuovo online.",
        "offline.retry": "Riprova"
      },
      "ru": {
        "offline.title": "Нет подключения к сети",
        "offline.description": "Для этой страницы нужен интернет. Она перезагрузится сама, как только подключение восстановится.",
        "offline.retry": "Повторить"
      },
      "qu": {
        "offline.title": "Mana internetniyuqmi kanki",
        "offline.description": "Kay p'anqaqa internetta munan. Internet kutimuqtinqa kikillanmanta musuqmanta kicharikunqa.",
        "offline.retry": "Musuqmanta ruway"
      },
      "fr": {
        "offline.title": "Vous êtes hors ligne",
        "offline.description": "Cette page a besoin d'une connexion internet. Elle se rechargera d'elle-même dès que vous serez de nouveau en ligne.",
        "offline.retry": "Réessayer"
      },
      "pt": {
        "offline.title": "Você está offline",
        "offline.description": "Esta página precisa de conexão com a internet. Ela será recarregada automaticamente assim que você voltar a ficar online.",
        "offline.retry": "Tentar novamente"
      }
    }
  </script>
  <script>
    // Same order as resolveLocale() in lib/i18n/index.ts: stored choice,
    // locale cookie, browser languages, English.
    (function () {
      var KEY = 'sacred-fire-songs-locale';
      var ALIASES = { quz: 'qu', quy: 'qu', que: 'qu' };
      var messages = JSON.parse(document.getElementById('offline-messages').textContent);

      function supported(code) {
        return code && Object.prototype.hasOwnProperty.call(messages, code) ? code : null;
      }
      function match(tag) {
        if (!tag) return null;
        var base = String(tag).trim().toLowerCase().split('-')[0];
        return supported(base) || supported(ALIASES[base]);
      }
      function readCookie() {
        var parts = document.cookie.split(';');
        for (var i = 0; i < parts.length; i++) {
          var pair = parts[i].trim().split('=');
          if (pair[0] === KEY) return decodeURIComponent(pair.slice(1).join('='));
        }
        return null;
      }

      var stored = null;
      try { stored = localStorage.getItem(KEY); } catch (e) { /* storage blocked */ }
      var locale = supported(stored) || supported(readCookie());
      var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
      for (var i = 0; !locale && i < languages.length; i++) locale = match(languages[i]);
      locale = locale || 'en';

      var texts = messages[locale];
      document.documentElement.lang = locale;
      document.getElementById('offline-title').textContent = texts['offline.title'];
      document.getElementById('offline-description').textContent = texts['offline.description'];
      var retry = document.getElementById('offline-retry');
      retry.textContent = texts['offline.retry'];
      retry.addEventListener('click', function () { location.reload(); });
      addEventListener('online', function () { location.reload(); });
    })();
  </script>
</body>
</html>
