name: Build and push Docker image

on:
  push:
    # develop → staging images (:develop + short SHA, deployed by deploy-staging.yml);
    # main → short-SHA images; v* tags / releases → semver images for production.
    branches: ["main", "develop"]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to apply (e.g. v1.4.0-rc.1 or preview)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(main): release') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for E2E Tests (Main Branch Only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Looking for E2E workflow run for commit ${{ github.sha }}..."
          sleep 5 # Allow GitHub time to trigger the parallel workflow
          
          RUN_ID=$(gh run list --workflow=e2e.yml --commit ${{ github.sha }} --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          
          if [[ -n "$RUN_ID" && "$RUN_ID" != "null" ]]; then
            echo "Found E2E run: $RUN_ID. Waiting for it to complete..."
            gh run watch "$RUN_ID"
            
            CONCLUSION=$(gh run view "$RUN_ID" --json conclusion -q '.conclusion')
            if [[ "$CONCLUSION" == "success" ]]; then
              echo "✅ E2E tests passed! Proceeding with Docker build."
            else
              echo "❌ E2E tests failed (conclusion: $CONCLUSION). Aborting Docker build."
              exit 1
            fi
          else
            echo "⚠️ No E2E workflow found for this commit. Proceeding."
          fi

      - name: Extract semver from release tag
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        id: semver
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata for App
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-app
          labels: |
            org.opencontainers.image.ref.name=${{ github.ref_name }}
          tags: |
            # Never :latest — every environment pins an explicit tag (staging :develop, prod vX.Y.Z)
            type=sha,prefix=,format=short,enable=${{ github.event_name == 'push' }}
            type=ref,event=branch,slugify=true
            type=ref,event=tag
            type=raw,value={{tag}},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ steps.semver.outputs.value }},enable=${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}

      - name: Build and push app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata for Migrator
        id: meta-migrator
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/sacred-fire-songs-migrator
          labels: |
            org.opencontainers.image.ref.name=${{ github.ref_name }}
          tags: |
            # Never :latest — every environment pins an explicit tag (staging :develop, prod vX.Y.Z)
            type=sha,prefix=,format=short,enable=${{ github.event_name == 'push' }}
            type=ref,event=branch,slugify=true
            type=ref,event=tag
            type=raw,value={{tag}},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ steps.semver.outputs.value }},enable=${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}

      - name: Build and push migrator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.migrator
          push: true
          tags: ${{ steps.meta-migrator.outputs.tags }}
          labels: ${{ steps.meta-migrator.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
