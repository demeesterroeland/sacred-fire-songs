name: Back-merge main into develop

# Gitflow (Epic 5.1, Story 5.1.9): after every push to main (promotion, Release
# Please release commit or hotfix) open a pull request main → develop so version
# bumps, changelog and hotfixes are never lost on develop.
#
# - The PR is created with RELEASE_PLEASE_TOKEN (a PAT): PRs opened with the
#   default GITHUB_TOKEN do not trigger CI, so the required checks would never run.
#   The job fails closed when the secret is missing.
# - A test merge detects conflicts; conflicting PRs get the "back-merge-conflict"
#   label and a comment. The PR is never merged here: the owner merges it with a
#   merge commit once the required checks pass.
# - A push to main runs the copy of this file that is on main. A hotfix pushed
#   before this file reached main gets no back-merge PR (#608, release 1.7.1):
#   once this file is on main, a missed run can be started by hand with
#   `gh workflow run back-merge.yml --ref main`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: back-merge
  cancel-in-progress: false

jobs:
  back-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      - name: Require the PR token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Missing secret RELEASE_PLEASE_TOKEN: back-merge PRs need a PAT so CI runs on them."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether main is ahead of develop
        id: ahead
        run: |
          AHEAD="$(git rev-list --count origin/develop..origin/main)"
          echo "main is $AHEAD commit(s) ahead of develop"
          echo "count=$AHEAD" >> "$GITHUB_OUTPUT"

      - name: Open or reuse the back-merge pull request
        if: steps.ahead.outputs.count != '0'
        id: pr
        run: |
          NUMBER="$(gh pr list --base develop --head main --state open --json number -q '.[0].number')"
          if [ -z "$NUMBER" ]; then
            URL="$(gh pr create --base develop --head main \
              --title "chore: back-merge main into develop" \
              --body "Automatic Gitflow back-merge of \`main\` into \`develop\` (Story 5.1.9). Merge with a **merge commit** once the required checks pass.")"
            NUMBER="$(gh pr view "$URL" --json number -q .number)"
          fi
          echo "Back-merge PR #$NUMBER"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Label the pull request when main does not merge cleanly
        if: steps.ahead.outputs.count != '0'
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -c back-merge-check origin/develop
          if git merge --no-commit --no-ff origin/main >/dev/null 2>&1; then
            echo "main merges cleanly into develop."
            gh pr edit "$NUMBER" --remove-label back-merge-conflict >/dev/null 2>&1 || true
          else
            CONFLICTS="$(git diff --name-only --diff-filter=U)"
            git merge --abort || true
            gh label create back-merge-conflict --color B60205 \
              --description "main does not merge cleanly into develop" >/dev/null 2>&1 || true
            gh pr edit "$NUMBER" --add-label back-merge-conflict
            MARKER="<!-- back-merge-conflict -->"
            {
              echo "$MARKER"
              if [ -n "$CONFLICTS" ]; then
                echo "⚠️ \`main\` does not merge cleanly into \`develop\`. Conflicting files:"
                echo
                # shellcheck disable=SC2016 # the backticks are Markdown code marks, not a command
                printf '%s\n' "$CONFLICTS" | sed 's/^/- `/; s/$/`/'
              else
                echo "⚠️ \`main\` does not merge cleanly into \`develop\`, but no file-level conflicts were found: see the workflow run log."
              fi
              echo
              echo "Resolve the conflicts on a \`chore/…\` branch from \`develop\` (merge \`origin/main\` into it, see docs/guides/git-workflow.md). Merge that PR with a merge commit, then close this PR."
            } > conflict-comment.md
            # One comment per PR: update it on later pushes instead of adding another.
            COMMENT_ID="$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate \
              --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | tail -n 1)"
            if [ -n "$COMMENT_ID" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -F body=@conflict-comment.md >/dev/null
            else
              gh pr comment "$NUMBER" --body-file conflict-comment.md
            fi
            echo "::warning::Back-merge PR #$NUMBER has conflicts in: $(echo "$CONFLICTS" | tr '\n' ' ')"
          fi
