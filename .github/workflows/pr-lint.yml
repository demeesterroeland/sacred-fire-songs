name: PR lint

# Gitflow pull-request policy (Epic 5.1, Story 5.1.5): Conventional Commit
# title (drives Release Please) and allowed head → base branches.
# Logic + tests: scripts/cicd/lib/prPolicy.mjs, testing/unit/tests/ci/prPolicy.test.ts.
# The job id `pr-policy` is a required status check on develop and main.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: pr-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Untrusted PR data only reaches the script through env vars (no ${{ }} in run:)
      - name: Check PR title and branches
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: node scripts/cicd/lib/prPolicy.mjs
